[workspace]
authors = ["Riccardo Cappuzzo <riccardo.cappuzzo@gmail.com>"]
channels = ["conda-forge"]
name = "skrub-materials"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
render-all = "quarto render"

[dependencies]
skrub = "*"
ipython = ">=9.7.0,<10"
jupyter = ">=1.1.1,<2"
polars = ">=1.35.1,<2"
pyarrow = ">=22.0.0,<23"
plotly = ">=6.5.0,<7"
numpy = "*"
pandas = "*"
quarto = ">=1.9.38,<2"
