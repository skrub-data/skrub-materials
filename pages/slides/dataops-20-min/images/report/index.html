    <style>
     html {
    font-family: sans-serif;
    --current-node-color: #15ed8f;
}

h1,h2,h3,h4 {
    margin-top: 0.6em;
    margin-bottom: 0.2em;
    margin-left: 0;
    margin-right: 0;
}
h1 {
    margin-top: 0;
}

ul {
    margin: 0.1em;
}

* *::before, *::after {
    box-sizing: border-box;
}

pre, code {
    font-size: 1rem;
}

.docstring-details summary {
    cursor: pointer;
}

.docstring-details {
    margin: 1em 0;
}

#graph-nav text {
    transform: translateY(2px);
}

.data_op-node-wrapper {
    overflow-x: auto;
}

.mini-nav > ul {
    display: grid;
    grid-template-columns: 10ch 10ch 10ch;
    list-style-type: none;
}

.data_op-node {
    display: flex;
    height: calc(100vh - 24px - 24px);
}

.data_op-node > * {
    padding: 1rem;
    max-height: 100%;
    overflow-y: auto;
}

.data_op-node > nav.main-nav {
    padding-top: 24px;
    border-right: 2px solid #ccc;
    flex-shrink: 0;
}

.fixed-report-title ~ .data_op-node-wrapper > .data_op-node > nav.main-nav {
    padding-top: 30px;
}

.node-details {
    flex-grow: 1;
    flex-shrink: 1;
}

.node-details[data-has-error]{
    background: #ffcccc;
}

.node-details[data-is-skipped]{
    background: #eee;
}

.is-skipped-message{
    background: #eee;
    padding: 0 1em 1em 1em;
    border: 1px solid black;
}

.is-skipped-message + * {
    margin-top: 1em;
}

.node-creation-stack {
    font-size: 1rem;
}

.node-creation-stack a {
    text-decoration: none;
}

.node-creation-stack .node-creation-stack-line {
    display: block;
    margin-left: 2em;
}

.main-nav:not([data-is-open]){
    display: none;
}

.main-nav[data-is-open] + .node-details {
    min-width: min(95%, 25rem);
}

.nav-legend-current-node {
    display: flex;
    background: var(--current-node-color);
    border: 4px solid black;
    font-size: 1.2rem;
    padding: 3px;
}

.nav-legend-current-node + * {
    margin-top: 2rem;
}

.current-node polygon {

    fill: var(--current-node-color);
    stroke-width: 3;
}

.icon-button {
    position: absolute;
    left: 5px;
    top: 10px;
    padding: 2px;
    width: 24px;
    height: 24px;
}

.fixed-report-title {
    position: absolute;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
    left: 40px;
    top: 5px;
    padding: 2px;
    padding-top: 0;
    margin: 0;
}

.error-node polygon {
    stroke: red;
    stroke-width: 3;
}

.skipped-node polygon {
    stroke-dasharray: 4;
}
    </style>
</head>

<script>
 (function() {

    function highlightCurrentNode() {
        const graphDiv = document.getElementById('graph-nav');
        const currentNode = graphDiv.dataset.currentNodeId;
        const nodeElem = document.getElementById(currentNode);
        if (nodeElem === null){
            return;
        }
        nodeElem.classList.add('current-node');
    }
    highlightCurrentNode();

    function toggleNav() {
        const nav = document.querySelector("nav");
        if (nav === null){
            return;
        }
        if (nav.hasAttribute("data-is-open")) {
            nav.removeAttribute("data-is-open");
        } else {
            nav.setAttribute("data-is-open", "");
        }
    }
    const toggleNavButton = document.getElementById('toggle-nav');
    if (toggleNavButton !== null){
        toggleNavButton.addEventListener("click", toggleNav);
    }

    function showNodeStatus() {
        const graphDiv = document.getElementById('graph-nav');
        const nodeStatus = JSON.parse(graphDiv.dataset.nodeStatus);
        for (const nodeId in nodeStatus) {
            const nodeElem = document.getElementById(`node_${nodeId}`);
            switch (nodeStatus[nodeId]) {
            case 'success':
                nodeElem.classList.add('success-node');
                break;
            case 'error':
                nodeElem.classList.add('error-node');
                break;
            case 'skipped':
                nodeElem.classList.add('skipped-node');
                break;
            default:
                // eval=False was passed to .skb.report(), no particular styling
                // needed on any nodes.
                break;
            }
        }
    }
    showNodeStatus();
})();
</script>
